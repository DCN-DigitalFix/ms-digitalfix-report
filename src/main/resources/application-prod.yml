# Perfil de produccion: PostgreSQL.
#
# Se activa con --spring.profiles.active=prod o con SPRING_PROFILES_ACTIVE=prod.
# Ningun valor sensible esta escrito aqui: todos vienen del entorno.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:digitalfix}
    username: ${DB_USER:digitalfix}
    password: ${DB_PASSWORD:digitalfix}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000

  jpa:
    hibernate:
      # update crea y ajusta las tablas al arrancar. En un sistema real el
      # esquema lo manejaria una herramienta de migraciones y esto seria validate.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
