server:
  port: 8086

spring:
  profiles:
    active: dev
  application:
    name: ms-digitalfix-report

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/6e49fdba-8435-41ac-8074-7b1a04cfd543/v2.0

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

digitalfix:
  security:
    audiences:
      - 13a645a9-ea0e-498e-96b8-55a3d56f10eb
      - api://13a645a9-ea0e-498e-96b8-55a3d56f10eb
  cors:
    allowed-origins:
      - http://localhost:4200
      - https://44.206.195.117

  # ---------------------------------------------------------------------------
  # Kafka: report consume dos topicos, cada uno con su propio grupo.
  #
  #   digitalfix.workorders.events -> grupo report-metrics
  #     Mismo topico que lee audit con "audit-timeline": ninguno le quita
  #     mensajes al otro.
  #
  #   digitalfix.audit.events -> grupo report-audit-trail
  #     Lo publica audit despues de guardar cada WorkOrderEvent. report solo
  #     cuenta cuantos hay (ver AuditTrailService) y lo expone en el resumen.
  # ---------------------------------------------------------------------------
  kafka:
    topics:
      workorders-events: digitalfix.workorders.events
      audit-events: digitalfix.audit.events
    consumer:
      concurrencia: 3
      max-reintentos: 3
      backoff-inicial-ms: 1000
      backoff-multiplicador: 2.0
      backoff-maximo-ms: 8000

logging:
  level:
    cl.duoc.ms_digitalfix_report: INFO
